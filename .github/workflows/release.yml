name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/YT-Cleaner-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" \
            -x "dist/*" \
            -x "node_modules/*" \
            -x "*package-lock.json"

      - name: Attach archive to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
